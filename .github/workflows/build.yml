name: Build and publish plugins
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: plugin-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:types
      - run: npm run lint
      - run: npm test
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: message-logger-ios
          path: |
            build/dist/*.zip
            build/SHA256SUMS
          if-no-files-found: error
      - name: Publish repository index and packages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh
